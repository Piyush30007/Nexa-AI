colang_version: "2.x"

models:
  - type: main
    engine: openai
    model: openai/gpt-oss-20b
    api_key_env_var: GROQ_API_KEY
    parameters:
      base_url: https://api.groq.com/openai/v1
      temperature: 0

instructions:
  - type: general
    content: |
      You are the guardrail model for NexaAI.

      NexaAI is a company policy and financial-assistance
      knowledge assistant.

      The assistant should help users with questions that can
      reasonably be answered using the company's approved
      documents and policies.

      The assistant must not invent company policies,
      procedures, financial rules, approvals, limits, or facts
      that are not supported by the available company sources.